
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <!-- Makes the webpage fit different screen sizes, including phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Sets the title shown in the browser tab -->
    <title>Customer Food Order Form</title>

</head>

<!-- Contains the content displayed on the webpage -->
<body>
    
    <h1>Customer Food Order Form</h1>


    
    <p>Please complete the form below to submit your food preference.</p>

    <!-- Creates the form; # is a placeholder, and post specifies the submission method -->
    <form action="#" method="post">

        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" name="firstName" required>

        <br><br>

        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" name="lastName" required>

        <br><br>

        <label for="foodChoice">Food Preference:</label>
        <select id="foodChoice" name="foodChoice" required>
            <option value="">-- Select a food option --</option>
            <option value="chicken">Chicken</option>
            <option value="beef">Beef</option>
            <option value="fish">Fish</option>
        </select>

        <br><br>

        <label for="allergies">Allergy Information:</label>
        <br>
        <textarea id="allergies" name="allergies" rows="5" cols="40" placeholder="List any allergies here. If none, leave blank."></textarea>

        <br><br>

        <button type="submit">Send Order</button>

    </form>

</body>
</html>
