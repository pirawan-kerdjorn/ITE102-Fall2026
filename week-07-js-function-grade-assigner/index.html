
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- Sets character encoding so the browser can display text and symbols correctly. -->
    <title>The Grade Assigner</title> <!-- Title displayed on the browser tab. -->
</head>
<body>

    <h1>The Grade Assigner</h1> <!-- Main heading of the webpage. -->

    <p>Enter your score to find your letter grade.</p>

    <form id="gradeForm"> <!-- Creates a form -->
        <label for="score">Enter your score (0-100):</label>

        <!-- Creates a number input. The minimum is 0, maximum is 100 -->
        <input type="number" id="score" min="0" max="100" required>

        <button type="submit">Calculate Grade</button>
    </form>

    <!-- Creates an empty paragraph where JavaScript can display the calculated letter grade. -->
    <p id="result"></p> 

    <script src="script.js"></script>

</body>
</html>
